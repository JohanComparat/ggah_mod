[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ggah_mod"
version = "1.1.0.dev2"
description = "A layered, differentiable halo-model forward model for galaxies, gas and AGN"
authors = [{name = "Johan Comparat", email = "jcomparat@lpsc.in2p3.fr"}]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["cosmology", "halo model", "large-scale structure", "galaxy-halo connection",
            "AGN", "intracluster medium", "JAX", "automatic differentiation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "scipy",
    "jax",
    "jaxlib",
    # The linear-P(k) emulator: the *only* differentiable spectrum here since
    # CosmoPower-JAX was removed, so this is a requirement in the strong sense
    # -- the differentiable flavour cannot be built without it.  Its network
    # carries massive neutrinos and CPL natively, so nothing here reads the
    # distilled correction the package also ships.  Its *core* install is numpy
    # and jax only -- classy and optax are extras there -- so this does not drag
    # a Boltzmann solver or a training stack into `pip install ggah_mod`.
    # **Capped below 2 from 2026-09-07 to 2026-09-10, and the cap named its own
    # release condition.**  2.0.0 checks that a checkpoint carries every input
    # its box samples, and the weights shipped then predated `Omega_k`, so the
    # check refused them -- correctly, since a network trained on a narrower box
    # would otherwise ignore those values and return a spectrum rather than an
    # error.  `power.py` forwards `check_box` and never `allow_narrow_box`, so
    # that refusal was unreachable from this package's API and the
    # differentiable flavour could not be built at all.
    #
    # **Lifted because the condition was met, not because the cap was
    # inconvenient.**  2.0.0 now ships a checkpoint retrained *with* `Omega_k`,
    # eleven box names of which the network eats nine -- `n_s` and `ln10A_s` are
    # the reduced target, restored in closed form rather than fed in.  The floor
    # is `>=2.0.0` rather than `>=1.0.0` because `GgahEmuPk._params` builds its
    # vector from `emu_pk.box.PARAMS`: against a 1.x box that yields eight
    # entries with `supports_curvature = True` beside it, which is the one
    # arrangement that answers a curved cosmology from a flat network *without*
    # raising, since eight is not short for an eight-name box.
    #
    # What it cost, as the cap said it would: emu_pk is in
    # `GgahAdapter.subject_modules`, so the new weights invalidate every cached
    # ggah column and the campaign re-runs rather than extends.  X9, X10.
    #
    # **A version floor is not a checkpoint pin, and only one of them is here.**
    # This admits any 2.x, and a 2.x point release shipping retrained weights
    # would move every number measured against `4c70c36a` without the
    # constraint noticing.  That is the right shape for a *library* -- pinning a
    # hash here would make an ordinary upgrade a packaging change -- but it is
    # the wrong shape for a *campaign*, and `ggah_mod_benchmark` pins the
    # weights hash rather than the version for exactly that reason.
    #
    # **Floored at 2.0.1 for 1.0.0, and the floor is a correctness one.**
    # 2.0.1 restates this package's 0.9.8 neutrino convention, the derived
    # rest-mass denominator `NU_DENOM_EV = 93.1434` in place of the rounded
    # 93.14; against 2.0.0 the two packages' `f_nu` differ by 3.6e-5 and
    # `tests/test_pk_correction.py` fails.  X47.
    "emu_pk >=2.0.1,<3",
    # The recalibrated multiplicity function.  Promoted from an extra to a
    # requirement when it became the default flavours' mass function: an
    # optional dependency the default path needs is not optional.  On PyPI
    # from 1.0.0, so this resolves from an index rather than from a repository.
    #
    # **Floored at 1.2.0, 2026-09-10, and the floor is a correctness one.**
    # 1.2.0 fixed a convention this package caused: `to_ggah_cosmology` added
    # `Omega_nu` while `Omega_cb` had been redefined to subtract
    # `Omega_nu_matter`, which cost 1.0e-4 of `Omega_cb` at 0.3 eV -- straight
    # into `rho_cold`, and so into the variance the whole recalibration is
    # defined against.  Against 1.2.0 the two conversions are exact inverses,
    # bit for bit on all eight components.  1.2.0 also pins `nu_hierarchy` to
    # `"degenerate"` when it builds a `Cosmology`, because this package's
    # default of `"normal"` has no solution below 0.058993 eV and refused a
    # fifth of emu_hmf's own design.
    #
    # It is also what makes `MULTIPLICITY_CAPABILITY`'s numbers checkable:
    # 1.2.0 exports `OMEGA_K_COST`, `OMEGA_K_CROSSOVER`, `OMEGA_K_MEASURED_TO`
    # and `OMEGA_K_MEASURED_CROSSING`, which `tests/test_curvature_halos.py`
    # asserts this package's restatement against.  Below 1.2.0 that test skips,
    # and a skipped drift check reads as green without being one.
    "emu_hmf >=1.2.0,<2",
]

[project.optional-dependencies]
# CLASS is the reference Boltzmann solver and the only backend that treats
# massive neutrinos exactly.
# Capped below 3.4 for 1.0.0: the ACCURATE flavour's precision settings, its
# measured accuracy and emu_pk's training set are all CLASS v3.3.4, and the
# 3.4.0.0 source distribution on PyPI fails to build ("include/common.h").
# classy ships no wheels, so pip compiles CLASS: a C compiler is needed.
reference = ["classy >=3.3.4,<3.4"]
# CAMB: the second Boltzmann solver, and the independent implementation that
# arbitrates a CLASS result.
backends  = ["camb"]
# `hod_mod` is a **test-only** dependency: the parity suite measures this
# package against it while kernels are ported.  Nothing under `ggah_mod/` imports
# it, and `pip install ggah_mod` does not pull it in -- that independence is the
# point of the rewrite, and `tests/parity/` is where the old package is allowed
# to appear.
# `pytest-xdist` is a *requirement* of the dev extra, not a convenience: the
# `addopts` below pass `-n auto`, so a fresh `pip install -e ".[dev]"`
# without it fails at collection with "unrecognized arguments: -n".  It was
# missing for exactly as long as it took to run the suite in an environment
# that already had it, which is every environment on the machine it was
# added on -- and none in CI.
dev = ["pytest", "pytest-cov", "pytest-xdist", "astropy", "colossus", "camb"]
# `soxs` regenerates the APEC cooling table (`python -m ggah_mod.sectors.cooling`).
# Not a runtime dependency: the distilled table ships with the package, and the
# X-ray view of the gas sector reads it rather than APEC.
tables = ["soxs"]
# `ggah_mod.interfaces.cobaya` only; nothing under ggah_mod/ imports it
# otherwise, which is why that subpackage re-exports nothing.
cobaya = ["cobaya"]
# The documentation (`docs/`, built on Read the Docs).  Notebooks are rendered from
# their committed outputs and never executed by the build, so this needs neither a
# Boltzmann solver nor a kernel -- `make docs` executes them first, in `$(PY)`.
docs = ["sphinx>=7", "furo", "myst-nb>=1", "sphinx-copybutton", "sphinxcontrib-bibtex>=2.6"]

[project.urls]
Documentation = "https://ggah-mod.readthedocs.io"
Source = "https://github.com/JohanComparat/ggah_mod"
Issues = "https://github.com/JohanComparat/ggah_mod/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ggah_mod*"]

# Distilled tables are part of the package, not build artefacts: without these
# globs a wheel installs the code and none of its data, and
# `halos.beyond_linear_bias` raises on first use.  The neutrino/dark-energy
# correction is no longer among them -- it moved to `emu_pk`.
[tool.setuptools.package-data]
"ggah_mod.data.bnl" = ["*.npz"]
"ggah_mod.data.apec" = ["*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-n auto`: 14 min 32 s serially against 6 min 14 s across sixteen cores, both
# measured 2026-09-04 on this tree.  A gate nobody waits for is not a gate.
#
# It was set once before on a weaker check and had to be taken out again, which
# is the part worth writing down.  The evidence then was that the suite gave the
# same 2196 passed / 5 skipped in parallel as serially -- a comparison of
# *whole-suite totals*, which cannot see a file that fails only when a worker
# reaches something cold.  Two did:
#
#   * `halos/mass_function.py::_hmf_correction` cached an `HmfCorrection` built
#     inside a trace;
#   * `tests/conftest.py::AnalyticPk._norm` computed a lazily cached constant
#     inside a trace.
#
# Both are the same defect -- a lazily cached constant is unsafe exactly when its
# first use can be inside a trace, and in this package it always can, because a
# refusal inside a trace is an exception inside a trace.  Both are fixed with
# `jax.ensure_compile_time_eval`, and `tests/test_hmf_cache_and_traces.py` pins
# the first.
#
# The evidence now is per file: every one of the 51 modules under `tests/` passes
# on its own under `-n auto`.  That is the check the totals could not do.
# `-p no:xdist` when a failure needs readable output.
addopts = "-n auto"

markers = [
    "slow: builds a Boltzmann spectrum or a large table",
    "parity: compares against the hod_mod reference implementation",
    "x64: needs JAX_ENABLE_X64=1 (gradient-vs-finite-difference checks)",
]

[tool.coverage.run]
branch = true
source = ["ggah_mod"]
omit = [
    # The CSSTemu compatibility shim.  tests/test_backends.py exercises it in a
    # fresh interpreter where the optional, git-installed CEmulator is present;
    # coverage does not follow a subprocess, and CI has no CEmulator.
    "ggah_mod/halos/_cemulator_compat.py",
]

[tool.coverage.report]
# The floor under the CI measurement (core install, no CLASS, `-m "not slow"`,
# branch coverage), set a point below it when 1.0.0 was released so that
# coverage cannot fall without a test failing.  Raise it as it rises.
fail_under = 85
show_missing = true
skip_covered = true
