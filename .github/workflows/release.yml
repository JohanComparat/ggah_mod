name: release

# Publishing a release: push a tag `vX.Y.Z` equal to `ggah_mod.__version__`.
# The sdist and wheel are built once, checked, installed and smoke-tested, then
# uploaded to PyPI by trusted publishing (no token is stored here: the PyPI
# project must list this repository and the `pypi` environment as a trusted
# publisher), and attached to a GitHub release.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: The tag is the package's version
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('ggah_mod/__init__.py').read()).group(1))")
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "tag ${GITHUB_REF_NAME} does not match ggah_mod.__version__ = ${version}"; exit 1; }
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: The wheel installs and runs, with its data
        run: |
          python -m venv /tmp/wheel
          /tmp/wheel/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel/bin/python -c "
          import jax; jax.config.update('jax_enable_x64', True)
          import numpy as np, ggah_mod
          from ggah_mod.cosmology import PLANCK18, make_pk, sigma8
          from ggah_mod.halos.field import make_field
          pk = make_pk('emu_pk'); k = np.logspace(-4, np.log10(200.0), 512)
          print(ggah_mod.__version__, float(sigma8(pk.pk(k, 0.0, PLANCK18), k)))
          f = make_field(PLANCK18, ggah_mod.DIFFERENTIABLE, pk, z=0.0)
          from ggah_mod.halos.beyond_linear_bias import load; load()
          "
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}

  pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1

  github:
    name: GitHub release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "ggah_mod ${GITHUB_REF_NAME#v}" \
            --notes "See CHANGELOG.md for what changed."
